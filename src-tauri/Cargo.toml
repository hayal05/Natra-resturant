[package]
name = "natra-restaurant"
version = "0.1.0"
description = "NATRA Restaurant Management"
authors = ["NATRA Tech"]
edition = "2021"

[lib]
name = "natra_restaurant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
r||||